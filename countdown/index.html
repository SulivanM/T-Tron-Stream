<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>T-Tron</title>
  <style>
    :root{ --text:#fff; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
    }
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .timer{
      color: var(--text);
      font-weight: 800;
      letter-spacing: 0.18em;
      font-size: clamp(96px, 14vw, 240px);
      line-height: 1;
      text-align: center;
      user-select: none;
      font-variant-numeric: tabular-nums;
    }
    .pulse{ animation: pulse 1s ease-in-out infinite; }
    .blink{ animation: blink .5s steps(1,end) infinite; }

    @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.6} }
    @keyframes blink{ 0%,50%{opacity:1} 50.01%,100%{opacity:0} }
  </style>
</head>
<body>
  <div id="timer" class="timer">05:00</div>

  <script>
    const DURATION = 5 * 60;
    let remaining = DURATION;
    let running = true;
    let last = performance.now();
    const el = document.getElementById("timer");

    const pad = n => String(n).padStart(2,"0");
    const fmt = s => `${pad(Math.floor(s/60))}:${pad(s%60)}`;

    const update = () => {
      el.textContent = fmt(remaining);
      el.classList.toggle("pulse", remaining <= 10 && remaining > 0);
      el.classList.toggle("blink", remaining === 0);
    };

    const reset = () => {
      remaining = DURATION;
      running = true;
      el.classList.remove("blink");
      last = performance.now();
      update();
    };

    const toggle = () => { running = !running; last = performance.now(); };

    const loop = (now) => {
      if (running && remaining > 0) {
        const d = now - last;
        if (d >= 1000) {
          const s = Math.floor(d / 1000);
          remaining = Math.max(0, remaining - s);
          last += s * 1000;
          update();
        }
      }
      requestAnimationFrame(loop);
    };

    document.addEventListener("keydown", e => {
      if (e.code === "Space") { e.preventDefault(); toggle(); }
      if (e.key.toLowerCase() === "r") reset();
    });

    update();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
